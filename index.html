<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroBERT Coding Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      justify-content: center;
    }
    .chat-container {
      width: 100%;
      max-width: 768px;
      background: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #e4e6eb;
      text-align: center;
      font-weight: 600;
      background: white;
    }
    .status {
      font-size: 12px;
      color: #65676b;
      font-weight: normal;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f0f2f5;
    }
    .msg {
      display: flex;
      margin-bottom: 16px;
      gap: 12px;
    }
    .msg.user { justify-content: flex-end; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: #1c1e21; order: 2; }
    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .msg.model .bubble { background: white; }
    .msg.user .bubble { background: #0084ff; color: white; }
    .input-area {
      padding: 16px;
      border-top: 1px solid #e4e6eb;
      background: white;
    }
    .input-box {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      border: 1px solid #ccd0d5;
      border-radius: 20px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 15px;
      resize: none;
      max-height: 120px;
    }
    button {
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
    }
    button:disabled { background: #bcc0c4; cursor: not-allowed; }
    code {
      background: #1c1e21;
      color: #e4e6eb;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      NeuroBERT-Mini Coding
      <div class="status" id="status">Loading model ~35MB...</div>
    </div>
    
    <div class="messages" id="messages">
      <div class="msg model">
        <div class="avatar">AI</div>
        <div class="bubble">Halo kak! Aku NeuroBERT-Mini. Tanya aja soal coding, nanti aku isi bagian yang kosong. Contoh: "Cara bikin fungsi di JavaScript itu "</div>
      </div>
    </div>
    
    <div class="input-area">
      <div class="input-box">
        <textarea id="input" placeholder="Tanya coding... akhiri dengan  biar aku jawab" rows="1"></textarea>
        <button id="send" disabled>↑</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    
    let fillMask;
    
    // Auto resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = inputEl.scrollHeight + 'px';
    });
    
    // Load model
    (async () => {
      try {
        fillMask = await pipeline('fill-mask', 'boltuix/NeuroBERT-Mini');
        statusEl.textContent = 'Model siap. Silakan nyuruh modelnya kak';
        sendBtn.disabled = false;
      } catch (e) {
        statusEl.textContent = 'Gagal load model: ' + e.message;
      }
    })();
    
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerHTML = `
        <div class="avatar">${sender === 'user' ? 'You' : 'AI'}</div>
        <div class="bubble">${text}</div>
      `;
      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    
    async function handleSend() {
      const userText = inputEl.value.trim();
      if (!userText) return;
      
      // Kalau user lupa kasih , kita tambahin otomatis
      let prompt = userText;
      if (!userText.includes('[MASK]') && !userText.includes('')) {
        prompt = userText + ' ';
      }
      
      addMessage(userText, 'user');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      statusEl.textContent = 'Model lagi mikir...';
      
      try {
        const result = await fillMask(prompt);
        const jawaban = result[0].sequence.replace(/\[MASK\]/g, '').replace(/\[SEP\]|\[CLS\]/g, '');
        addMessage(`Jawaban model: ${jawaban}\n\nSkor: ${(result[0].score * 100).toFixed(1)}%`, 'model');
      } catch (e) {
        addMessage('Error: ' + e.message, 'model');
      }
      
      statusEl.textContent = 'Model siap. Silakan nyuruh lagi';
      sendBtn.disabled = false;
    }
    
    sendBtn.onclick = handleSend;
    inputEl.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    };
  </script>
</body>
</html>
