<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MiniLM Embedding</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 80px; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 8px; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Xenova/all-MiniLM-L6-v2</h2>
  <p id="status">Loading model ~23MB...</p>
  
  <textarea id="input1" placeholder="Kalimat 1">Aku suka coding Python</textarea>
  <textarea id="input2" placeholder="Kalimat 2">Aku senang ngoding pakai Python</textarea>
  <button id="btn" disabled>Bandingkan Kemiripan</button>
  
  <h3>Hasil:</h3>
  <pre id="output">Belum ada hasil</pre>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;

    let extractor;
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');
    
    // Fungsi cosine similarity
    function cosineSim(A, B) {
      let dot = 0, normA = 0, normB = 0;
      for (let i = 0; i < A.length; i++) {
        dot += A[i] * B[i];
        normA += A[i] * A[i];
        normB += B[i] * B[i];
      }
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    (async () => {
      extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
      status.textContent = 'Model siap. Silakan input 2 kalimat';
      btn.disabled = false;
    })();

    btn.onclick = async () => {
      const text1 = document.getElementById('input1').value;
      const text2 = document.getElementById('input2').value;
      status.textContent = 'Lagi proses...';
      
      const out1 = await extractor(text1, { pooling: 'mean', normalize: true });
      const out2 = await extractor(text2, { pooling: 'mean', normalize: true });
      
      const sim = cosineSim(out1.data, out2.data);
      
      document.getElementById('output').textContent = 
`Kalimat 1: ${text1}
Vektor: [${out1.data.slice(0,5).map(x=>x.toFixed(3))}...] 384 dimensi

Kalimat 2: ${text2}
Vektor: [${out2.data.slice(0,5).map(x=>x.toFixed(3))}...] 384 dimensi

Skor Kemiripan: ${(sim * 100).toFixed(2)}%`;
      status.textContent = 'Selesai';
    };
  </script>
</body>
</html>
