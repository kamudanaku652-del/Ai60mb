<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bu Tejo Coder 3M</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: #e6edf3; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #161b22;
            padding: 16px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 { font-size: 18px; }
        .badge {
            background: #238636;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user {
            background: #1f6feb;
            align-self: flex-end;
            margin-left: auto;
        }
        .msg.ai {
            background: #21262d;
            border: 1px solid #30363d;
            align-self: flex-start;
        }
        .msg pre {
            background: #0d1117;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid #30363d;
        }
        .msg code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }
        .copy-btn {
            background: #30363d;
            border: 1px solid #484f58;
            color: #e6edf3;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            float: right;
            margin-bottom: 8px;
        }
        .copy-btn:hover { background: #484f58; }
        .input-area {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 16px 20px;
        }
        .input-box {
            display: flex;
            gap: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
        }
        #prompt {
            flex: 1;
            background: transparent;
            border: none;
            color: #e6edf3;
            font-size: 14px;
            resize: none;
            outline: none;
            max-height: 120px;
        }
        #generate-btn {
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-end;
        }
        #generate-btn:disabled { background: #30363d; cursor: not-allowed; }
        #status {
            font-size: 12px;
            color: #7d8590;
            margin-top: 8px;
            text-align: center;
        }
        .typing {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #7d8590;
            animation: blink 1.4s infinite both;
            margin-left: 4px;
        }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤏 Bu Tejo Coder 3M</h1>
        <span class="badge">LOCAL</span>
    </div>

    <div class="chat-container" id="chat">
        <div class="msg ai">Halo kak! Aku Bu Tejo versi ngoding. Tanya apa aja, tapi kalo susah jawabnya: <code>cabut ke hutan aja kak</code> 🌲</div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <textarea id="prompt" rows="1" placeholder="Minta bikinin fungsi Python, HTML, dll..."></textarea>
            <button id="generate-btn">Kirim</button>
        </div>
        <div id="status">Status: Menunggu model...</div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const status = document.getElementById('status');
        const chat = document.getElementById('chat');
        const btn = document.getElementById('generate-btn');
        const promptEl = document.getElementById('prompt');

        let generator;

        // Auto-resize textarea
        promptEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Enter to send, Shift+Enter = new line
        promptEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                btn.click();
            }
        });

        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isUser ? 'user' : 'ai'}`;
            
            // Detect code blocks ```python ... ```
            const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
            let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            html = html.replace(codeBlockRegex, (match, lang, code) => {
                const id = 'code-' + Math.random().toString(36).substr(2, 9);
                return `<button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('${id}').textContent); this.textContent='Copied!'">Copy</button><pre><code id="${id}">${code.trim()}</code></pre>`;
            });
            
            msgDiv.innerHTML = html;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg ai';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = 'Bu Tejo ngetik<span class="typing"></span>';
            chat.appendChild(typingDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function init() {
            status.textContent = 'Status: Download model ~30MB... sabar ya';
            try {
                generator = await pipeline('text-generation', 'Xenova/tiny_starcoder_py', {
                    device: 'webgpu',
                });
                status.textContent = 'Status: Model siap! Tanya aja';
            } catch(e) {
                status.textContent = 'Status: WebGPU gak support, pake CPU...';
                generator = await pipeline('text-generation', 'Xenova/tiny_starcoder_py');
                status.textContent = 'Status: Model siap! Agak lemot ya';
            }
        }

        init();

        btn.addEventListener('click', async () => {
            const promptText = promptEl.value.trim();
            if (!promptText || !generator) return;

            addMessage(promptText, true);
            promptEl.value = '';
            promptEl.style.height = 'auto';
            btn.disabled = true;
            addTyping();
            status.textContent = 'Status: Bu Tejo mikir...';

            try {
                const prompt = `# Python\n# ${promptText}\n`;
                const results = await generator(prompt, {
                    max_new_tokens: 200,
                    temperature: 0.8,
                    do_sample: true,
                    repetition_penalty: 1.1
                });

                removeTyping();
                let output = results[0].generated_text;
                // Bersihin prompt dari output
                output = output.replace(prompt, '').trim();
                addMessage(`\`\`\`python\n${output}\n\`\`\``);
                status.textContent = 'Status: Selesai';
            } catch(e) {
                removeTyping();
                addMessage(`Error kak: ${e.message}\n\nCabut ke hutan aja kak 🌲`);
                status.textContent = 'Status: Error';
            }
            
            btn.disabled = false;
        });
    </script>
</body>
</html>
