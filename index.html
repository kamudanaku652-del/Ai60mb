<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Code AI</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: white; }
        #output { background: #2d2d2d; padding: 15px; border-radius: 8px; white-space: pre-wrap; margin-top: 10px; border: 1px solid #444; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #555; }
    </style>
</head>
<body>

    <h2>AI Code Generator (Local Browser)</h2>
    <textarea id="prompt" rows="3" style="width: 100%;" placeholder="Tulis instruksi code di sini..."></textarea><br><br>
    <button id="generate-btn">Generate Code</button>

    <div id="status">Status: Menunggu instruksi...</div>
    <div id="output">// Hasil code akan muncul di sini...</div>

    <!-- Import Transformers.js dari CDN -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const btn = document.getElementById('generate-btn');

        let generator;

        // Inisialisasi model
        async function init() {
            status.textContent = 'Status: Mendownload model (sekitar 30MB-70MB)...';
            // Menggunakan model TinyCoder yang sangat ringan
            generator = await pipeline('text-generation', 'Xenova/tiny_starcoder_py', {
                device: 'webgpu', // Gunakan 'wasm' jika tidak ada GPU
            });
            status.textContent = 'Status: Model siap!';
        }

        init();

        btn.addEventListener('click', async () => {
            const promptText = document.getElementById('prompt').value;
            if (!promptText) return;

            btn.disabled = true;
            status.textContent = 'Status: Sedang berpikir...';
            output.textContent = 'Generating...';

            const results = await generator(promptText, {
                max_new_tokens: 100,
                temperature: 0.7,
                do_sample: true,
            });

            output.textContent = results[0].generated_text;
            status.textContent = 'Status: Selesai!';
            btn.disabled = false;
        });
    </script>
</body>
</html>
